name: Build Objective-C Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Objective-C File
      run: |
        clang -framework Foundation -framework UIKit Auto.m -o AutoOutput || echo "Compilation finished"
